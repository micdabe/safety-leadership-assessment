    function buildContentFromDbTables(areasRows, behaviorsRows, scenariosRows) {
      const sortedAreas = [...(areasRows || [])].sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
      const behByArea = {};
      (behaviorsRows || []).forEach(b => {
        if (!behByArea[b.area_id]) behByArea[b.area_id] = [];
        behByArea[b.area_id].push(b);
      });

      AREAS = sortedAreas.map(a => {
        const areaBehs = (behByArea[a.id] || [])
          .sort((x, y) => (x.behavior_idx || 0) - (y.behavior_idx || 0))
          .map(b => ({
            it: b.site_it,
            en: b.site_en,
            office_it: b.office_it,
            office_en: b.office_en
          }));
        return {
          id: a.id,
          name: a.name,
          color: a.color,
          desc: { it: a.desc_it, en: a.desc_en },
          behaviors: areaBehs
        };
      });

      COACHING_PROFILES = {};
      sortedAreas.forEach(a => {
        COACHING_PROFILES[a.id] = {
          it: {
            archetype: a.archetype_it,
            strength: a.strength_it,
            shadow: a.shadow_it,
            weakRisk: a.weak_risk_it,
            actions: Array.isArray(a.actions_it) ? a.actions_it : [],
            bridgeFrom: a.bridge_from_it,
            bridgeTo: a.bridge_to_it,
            bridgeTemplate: a.bridge_template_it || ""
          },
          en: {
            archetype: a.archetype_en,
            strength: a.strength_en,
            shadow: a.shadow_en,
            weakRisk: a.weak_risk_en,
            actions: Array.isArray(a.actions_en) ? a.actions_en : [],
            bridgeFrom: a.bridge_from_en,
            bridgeTo: a.bridge_to_en,
            bridgeTemplate: a.bridge_template_en || ""
          }
        };
      });

      const roundsMap = {};
      (scenariosRows || []).forEach(s => {
        const rNum = Number(s.round_num);
        if (!roundsMap[rNum]) {
          roundsMap[rNum] = {
            id: rNum,
            primaryMap: s.primary_map || {},
            site: { context: { it: "", en: "" }, title: { it: "", en: "" }, desc: { it: "", en: "" } },
            office: { context: { it: "", en: "" }, title: { it: "", en: "" }, desc: { it: "", en: "" } }
          };
        }
        if (s.primary_map && Object.keys(s.primary_map).length > 0) {
          roundsMap[rNum].primaryMap = s.primary_map;
        }
        const tType = String(s.target_type || "site").toLowerCase() === "office" ? "office" : "site";
        roundsMap[rNum][tType] = {
          context: { it: s.context_it, en: s.context_en },
          title: { it: s.title_it, en: s.title_en },
          desc: { it: s.desc_it, en: s.desc_en }
        };
      });

      SCENARIOS = Object.values(roundsMap).sort((a, b) => a.id - b.id);
      isAssessmentContentLoaded = (AREAS.length > 0 && SCENARIOS.length > 0);
      return isAssessmentContentLoaded;
    }

    async function fetchAssessmentContentFromSupabase(sbClient, useCache = true) {
      if (useCache) {
        try {
          const cached = sessionStorage.getItem("sl_db_assessment_content");
          if (cached) {
            const parsed = JSON.parse(cached);
            if (buildContentFromDbTables(parsed.areas, parsed.behaviors, parsed.scenarios)) {
              return true;
            }
          }
        } catch (e) {}
      }

      if (!sbClient) return false;

      const [areasRes, behRes, scenRes] = await Promise.all([
        sbClient.from("assessment_areas").select("*").order("sort_order", { ascending: true }),
        sbClient.from("assessment_behaviors").select("*").order("behavior_idx", { ascending: true }),
        sbClient.from("assessment_scenarios").select("*").order("round_num", { ascending: true })
      ]);

      if (areasRes.error) throw new Error("Tabella assessment_areas: " + areasRes.error.message);
      if (behRes.error) throw new Error("Tabella assessment_behaviors: " + behRes.error.message);
      if (scenRes.error) throw new Error("Tabella assessment_scenarios: " + scenRes.error.message);

      const ok = buildContentFromDbTables(areasRes.data, behRes.data, scenRes.data);
      if (ok) {
        try {
          sessionStorage.setItem("sl_db_assessment_content", JSON.stringify({
            areas: areasRes.data,
            behaviors: behRes.data,
            scenarios: scenRes.data
          }));
        } catch (e) {}
      }
      return ok;
    }

    function formatBridgeStrategyText(domProfile, weakProfile, topName, secondName, lowName, tObj) {
      const tpl = domProfile.bridgeTemplate;
      if (tpl && tpl.includes("{bFrom}")) {

          .replace(/\{bFrom\}/g, domProfile.bridgeFrom)
          .replace(/\{second\}/g, secondName)
          .replace(/\{low\}/g, lowName)
          .replace(/\{bTo\}/g, weakProfile.bridgeTo)
          .replace(/\{top\}/g, topName);
      }
      return tObj.bridgeTextFormat(domProfile.bridgeFrom, secondName, lowName, weakProfile.bridgeTo, topName);
    }

    function applyUiTextsFromDbRows(rows) {
      if (!Array.isArray(rows) || rows.length === 0) return false;
      const mapIt = {};
      const mapEn = {};
      rows.forEach(r => {
        if (!r || !r.key) return;
        if (r.text_it !== undefined && r.text_it !== null) mapIt[r.key] = String(r.text_it);
        if (r.text_en !== undefined && r.text_en !== null) mapEn[r.key] = String(r.text_en);
      });

      const coverKeyMap = {
        covDossierBadge: "dossierBadge",
        covMainTitle: "coverMainTitle",
        covSub: "coverSub",
        covPreparedFor: "lblPreparedFor",
        covLblCompany: "lblCompany",
        covLblSite: "lblSite",
        covLblWorkshop: "lblWorkshop",
        covLblDate: "lblDate"
      };

      const applyLangMap = (langCode, mapObj) => {
        Object.keys(mapObj).forEach(k => {
          const val = mapObj[k];
          if (coverKeyMap[k] && typeof COVER_LABELS !== "undefined" && COVER_LABELS[langCode]) {
            COVER_LABELS[langCode][coverKeyMap[k]] = val;
          } else if (k === "methCompactTitle" && typeof METH_COMPACT_TRANSLATIONS !== "undefined" && METH_COMPACT_TRANSLATIONS[langCode]) {
            METH_COMPACT_TRANSLATIONS[langCode].title = val;
          } else if (k === "methCompactText" && typeof METH_COMPACT_TRANSLATIONS !== "undefined" && METH_COMPACT_TRANSLATIONS[langCode]) {
            METH_COMPACT_TRANSLATIONS[langCode].text = val;
          } else if (k === "closedTitle") {
            UI_TEXT[langCode].closedTitle = (wsName) => val.replace(/\{wsName\}/g, wsName || "");
          } else if (k === "chosenCounter") {
            UI_TEXT[langCode].chosenCounter = (n) => val.replace(/\{n\}/g, n);
          } else if (k === "kpiStatsFormat") {
            UI_TEXT[langCode].kpiStatsFormat = (pts, c1, c2) =>
              val.replace(/\{pts\}/g, pts).replace(/\{c1\}/g, c1).replace(/\{c2\}/g, c2);
          } else if (k === "bridgeTitleFormat") {
            UI_TEXT[langCode].bridgeTitleFormat = (top, low) =>
              val.replace(/\{top\}/g, top || "").replace(/\{low\}/g, low || "");
          } else if (k === "skippedCountLabel") {
            UI_TEXT[langCode].skippedCountLabel = (n) => val.replace(/\{n\}/g, n);
          } else if (k === "logCarryApp") {
            UI_TEXT[langCode].logCarryApp = (n, w) => val.replace(/\{n\}/g, n).replace(/\{w\}/g, w);
          } else {
            UI_TEXT[langCode][k] = val;
          }
        });
        if (mapObj.choiceBadge1 || mapObj.choiceBadge2 || mapObj.choiceBadge3) {
          UI_TEXT[langCode].choiceBadge = (rank) => {
            if (rank === 1) return UI_TEXT[langCode].choiceBadge1 || (langCode === "it" ? "1ª Scelta" : "1st Choice");
            if (rank === 2) return UI_TEXT[langCode].choiceBadge2 || (langCode === "it" ? "2ª Scelta" : "2nd Choice");
            return UI_TEXT[langCode].choiceBadge3 || (langCode === "it" ? "3ª Scelta" : "3rd Choice");
          };
        }
      };

      applyLangMap("it", mapIt);
      applyLangMap("en", mapEn);

    function parseNumVal(val) {
      if (val === undefined || val === null) return 0;
      const num = parseFloat(String(val).replace("%", "").replace(",", ".").trim());
      return isNaN(num) ? 0 : num;
    }

    function reconstructSingleParticipant(row, wsFallback) {
      const norm = {};
      Object.keys(row || {}).forEach(k => norm[k.toLowerCase().trim()] = row[k]);

      const rawTarget = norm["workshop_target"] || norm["workshopTarget"] || wsFallback?.wsTarget || "site";
      const isOff = String(rawTarget).toLowerCase().includes("office") || String(rawTarget).toLowerCase().includes("hq");

      const pctSource = row.pct || {
        VISION: parseNumVal(norm["vision_pct"]),
        FOCUS: parseNumVal(norm["focus_pct"]),
        INFLUENCE: parseNumVal(norm["influence_pct"]),
        CREDIBILITY: parseNumVal(norm["credibility_pct"]),
        TEAM: parseNumVal(norm["team_pct"]),
        COMMUNICATION: parseNumVal(norm["communication_pct"]),
        FEEDBACK: parseNumVal(norm["feedback_pct"])
      };

      const pctMap = { ...pctSource };
      const sumPct = Object.values(pctMap).reduce((a, b) => a + b, 0);
      if (sumPct > 0 && sumPct <= 15) {
        Object.keys(pctMap).forEach(k => { pctMap[k] = Number((pctMap[k] * 10).toFixed(1)); });
      }

      const choicesLog = String(norm["riepilogo_scelte"] || row.choicesLog || "");
      const stats = {};
      AREAS.forEach(a => {
        stats[a.id] = { scoreFirst: 0, scoreCarry: 0, countFirst: 0, countCarry: 0, usedBehaviors: new Set() };
      });

      if (choicesLog && choicesLog !== "-") {
        const parts = choicesLog.split("|").map(s => s.trim()).filter(Boolean);
        parts.forEach(token => {
          const m = token.match(/S(\d+):([A-Z_]+)\(#(\d+),w=([0-9.]+),\+?([0-9.]+)(?:,b=(\d+))?\)/i);
          if (m) {
            const roundIdx = Math.max(0, Math.min(11, parseInt(m[1], 10) - 1));
            const areaId = m[2].toUpperCase();
            const w = parseFloat(m[4]);
            const pts = parseFloat(m[5]);
            const areaObj = AREAS.find(a => a.id === areaId);
            if (!areaObj) return;

            let bIdx = m[6] !== undefined ? parseInt(m[6], 10) : (SCENARIOS[roundIdx]?.primaryMap?.[areaId] ?? 0);
            if (bIdx >= areaObj.behaviors.length) bIdx = 0;

            stats[areaId].usedBehaviors.add(bIdx);
            const timesSkipped = w >= 0.99 ? 0 : (w >= 0.60 ? 1 : 2);
            if (timesSkipped === 0) {
              stats[areaId].scoreFirst += pts;
              stats[areaId].countFirst += 1;
            } else {
              stats[areaId].scoreCarry += pts;
              stats[areaId].countCarry += 1;
            }
          }
        });
      }

      const totalParsedPts = Object.values(stats).reduce((acc, s) => acc + s.scoreFirst + s.scoreCarry, 0);

      const results = AREAS.map(area => {
        const st = stats[area.id];
        let sFirst = st.scoreFirst;
        let sCarry = st.scoreCarry;
        let cFirst = st.countFirst;
        let cCarry = st.countCarry;
        let totScore = sFirst + sCarry;

        if (totalParsedPts === 0) {
          const rawPtCol = parseNumVal(norm[area.id.toLowerCase() + "_pt"]);
          const basePts = rawPtCol > 20 ? (rawPtCol / 100) : (rawPtCol > 0 ? rawPtCol : ((pctMap[area.id] || 14.3) * 0.25));
          sFirst = Number((basePts * 0.78).toFixed(2));
          sCarry = Number((basePts * 0.22).toFixed(2));
          totScore = Number((sFirst + sCarry).toFixed(2));
          cFirst = Math.max(1, Math.round(sFirst));
          cCarry = sCarry >= 0.35 ? 1 : 0;
        }

        const distPct = pctMap[area.id] > 0
          ? pctMap[area.id]
          : (totalParsedPts > 0 ? (totScore / totalParsedPts) * 100 : (100 / 7));

        return {
          id: area.id,
          name: area.name,
          color: area.color,
          scoreFirst: sFirst,
          scoreCarry: sCarry,
          totalScore: totScore,
          countFirst: cFirst,
          countCarry: cCarry,
          distributionPct: distPct,
          usedBehaviors: st.usedBehaviors
        };
      });

      const rawSec = parseInt(norm["durata_secondi"] ?? row.durationSec, 10);
      const durText = norm["durata_test"] || row.durationText || (
        !isNaN(rawSec) && rawSec > 0
          ? (Math.floor(rawSec / 60) > 0 ? `${Math.floor(rawSec / 60)}m ${rawSec % 60}s` : `${rawSec}s`)
          : "-"
      );

      return {
        id: norm["id"] || row.id || "-",
        name: norm["partecipante"] || row.name || "Anonimo",
        company: norm["azienda"] || row.company || "-",
        role: norm["ruolo"] || row.role || "-",
        site: norm["cantiere"] || row.site || wsFallback?.wsSite || "-",
        date: norm["data_ora"] || row.date || (norm["created_at"] ? new Date(norm["created_at"]).toLocaleString("it-IT") : "-"),
        durationText: durText,
        wsId: norm["workshop_id"] || row.workshopId || wsFallback?.wsId || "-",
        wsName: norm["workshop_nome"] || row.workshopName || wsFallback?.wsName || "Workshop",
        wsDate: norm["workshop_data"] || row.workshopDate || wsFallback?.wsDate || "-",
        wsLevel: norm["workshop_livello"] || row.workshopLevel || wsFallback?.wsLevel || "-",
        isOffice: isOff,
        lang: String(norm["lingua"] || row.lang || "IT").toUpperCase().includes("EN") ? "en" : "it",
        results
      };
    }

    function renderAllBatchReports() {
      // Destroy previous chart instances
      activeChartInstances.forEach(ch => { try { ch.destroy(); } catch (e) {} });
      activeChartInstances = [];

      const container = document.getElementById("batchReportsContainer");
      container.innerHTML = "";

      if (batchRawSubmissions.length === 0) {
        document.getElementById("screen-loading").classList.remove("hidden");
        document.getElementById("loadingTitle").textContent = "Nessun questionario presente per questo Workshop";
        document.getElementById("loadingSub").textContent = "Non ci sono ancora test completati associati a questa sessione Workshop.";
        return;
      }

      document.getElementById("screen-loading").classList.add("hidden");
      document.getElementById("batchCountBadge").textContent = `${batchRawSubmissions.length} Report (${batchRawSubmissions.length * 4} Pagine A4)`;

      const chartConfigsToInit = [];

      batchRawSubmissions.forEach((rawRow, idx) => {
        const p = reconstructSingleParticipant(rawRow, batchWorkshopMeta);
        const lang = batchLangMode === "IT" ? "it" : (batchLangMode === "EN" ? "en" : p.lang);
        const t = UI_TEXT[lang];
        const mc = METH_COMPACT_TRANSLATIONS[lang];
        const cv = COVER_LABELS[lang];

        const sorted = [...p.results].sort((a, b) => b.distributionPct - a.distributionPct);
        const top1 = sorted[0];
        const top2 = sorted[1];

          <!-- ===============================================================
               FACCIATA 4 (PAGINA 3 DEL REPORT: DETTAGLIO ANALITICO 7 AREE + NOTA METODOLOGICA)

          <div class="print-page-3 space-y-5">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 print-compact-card">
              <div class="flex items-center justify-between gap-2 mb-4">
                <h3 class="font-bold text-slate-900 text-lg">${t.tblMainTitle}</h3>

    async function initBatchPrintPage() {
      let postData = {};
      try {
        if (window.name && window.name.startsWith("SL_BATCH_PRINT:")) {
          postData = JSON.parse(window.name.slice(15)) || {};
        }
      } catch (e) {}

      if (!postData.wsId && !postData.wsName) {
        try {
          const raw = sessionStorage.getItem("sl_batch_print_ws") || localStorage.getItem("sl_batch_print_ws");
          if (raw) postData = JSON.parse(raw) || {};
        } catch (e) {}
      }

      if (window.location.search) {
        try { window.history.replaceState({}, document.title, window.location.pathname); } catch (e) {}
      }

      batchWorkshopMeta = postData;
      if (postData.wsName) {
        document.getElementById("batchHdrTitle").textContent = `Dossier Report Workshop: ${postData.wsName}`;
      }

      const sbUrl = (DEFAULT_SUPABASE_URL || localStorage.getItem("sl_sb_url") || "").trim();
      const sbKey = (DEFAULT_SUPABASE_ANON_KEY || localStorage.getItem("sl_sb_key") || "").trim();
      if (sbUrl && sbKey) {
        supabaseClient = window.supabase.createClient(sbUrl, sbKey);
      }

      try {
        await Promise.all([
          fetchAssessmentContentFromSupabase(supabaseClient, true),
          fetchUiTextsFromSupabase(supabaseClient, true)
        ]);
      } catch (err) {
        document.getElementById("loadingTitle").textContent = "Errore caricamento contenuti dal Database";
        document.getElementById("loadingSub").textContent = err.message;
        return;
      }

      // Query Supabase for all full submissions of this workshop so riepilogo_scelte and all columns are 100% complete
      let dbRows = [];
      if (supabaseClient && postData.wsId) {
        try {
          const { data, error } = await supabaseClient
            .from("submissions")
            .select("*")
            .eq("workshop_id", postData.wsId)
            .order("created_at", { ascending: true });
          if (!error && Array.isArray(data) && data.length > 0) {
            dbRows = data;
          }
        } catch (e) {}
      }

      if (dbRows.length === 0 && Array.isArray(postData.records) && postData.records.length > 0) {
        dbRows = postData.records;
      }

      batchRawSubmissions = dbRows;
      renderAllBatchReports();

      if (postData.autoPrint && batchRawSubmissions.length > 0) {
        setTimeout(() => {
          window.print();
        }, 500);
      }
    }
